name: Open inspection reminders (every 15 minutes)

# Calls the reminder job on the public site every 15 minutes. The job sends each buyer a reminder the day before and about an hour before an open
# inspection they booked (each once, per their notification settings).
# Repository secrets: APP_URL (public https origin, no trailing slash) and OPEN_INSPECTION_CRON_SECRET (same value as the app).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: open-inspection-reminders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due inspection reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.OPEN_INSPECTION_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and OPEN_INSPECTION_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and OPEN_INSPECTION_CRON_SECRET."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 60 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/open-inspections/reminders")
          echo "$body"
          echo "Open inspection reminders $(date -u +%FT%TZ): $body" >> "$GITHUB_STEP_SUMMARY"
