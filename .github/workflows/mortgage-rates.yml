name: Mortgage rates (daily)

# Refreshes published home-loan rates once a day (20:40 UTC). The RBA updates table F5 monthly; re-running is harmless.
# Repository secrets: APP_URL (public https origin, no trailing slash) and MORTGAGE_RATES_CRON_SECRET (same value as in the app).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mortgage-rates
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call the rates worker
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.MORTGAGE_RATES_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and MORTGAGE_RATES_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and MORTGAGE_RATES_CRON_SECRET."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 2 --retry-all-errors --max-time 600 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/mortgage-rates/run")
          echo "$body"
          echo "Mortgage rates $(date -u +%FT%TZ): $body" >> "$GITHUB_STEP_SUMMARY"
