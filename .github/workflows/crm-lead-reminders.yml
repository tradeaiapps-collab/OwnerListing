name: Buyer lead follow-up reminders (hourly)

# Tells each agent once about every buyer-lead follow-up that has come due (POST /api/internal/crm-leads/reminders). Safe to repeat.
# Repository secrets: APP_URL (public https origin, no trailing slash) and CRM_LEAD_CRON_SECRET (same value as the app).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: crm-lead-reminders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRM_LEAD_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and CRM_LEAD_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and CRM_LEAD_CRON_SECRET."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 60 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/crm-leads/reminders")
          echo "$body"
          echo "Buyer lead reminders $(date -u +%FT%TZ): $body" >> "$GITHUB_STEP_SUMMARY"
