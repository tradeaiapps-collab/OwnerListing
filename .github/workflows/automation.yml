name: Automation (every 15 minutes)

# Calls the automation tick on the public site every 15 minutes. The route applies listing-age workflow rules, sends the next batch of any
# campaign that is due or part way through, and runs scheduled tasks that are due. It is safe to repeat: everything is claimed before it runs.
# Repository secrets: APP_URL (public https origin, no trailing slash) and AUTOMATION_CRON_SECRET (same value as the app, 32+ chars).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the automation tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and AUTOMATION_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and AUTOMATION_CRON_SECRET."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 300 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/automation/run")
          echo "$body"
          echo "Automation $(date -u +%FT%TZ): $body" >> "$GITHUB_STEP_SUMMARY"
