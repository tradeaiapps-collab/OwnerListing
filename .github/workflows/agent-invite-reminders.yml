name: Agent invitation reminders (hourly)

# Calls the invitation reminder job once an hour. Each agent invitation still unanswered after 48 hours gets one reminder to the agent
# (in-app, email or text, as the agent chose). Safe to repeat: an invitation is claimed before it is reminded, so it is never reminded twice.
# Repository secrets: APP_URL (public https origin, no trailing slash) and APPOINTMENT_REMINDER_CRON_SECRET (same value as the app).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-invite-reminders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.APPOINTMENT_REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and APPOINTMENT_REMINDER_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and APPOINTMENT_REMINDER_CRON_SECRET."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 60 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/appointments/reminders")
          echo "$body"
          echo "Invite reminders $(date -u +%FT%TZ): $body" >> "$GITHUB_STEP_SUMMARY"
