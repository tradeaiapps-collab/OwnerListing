name: Android debug APK
# Manual only. Builds capacitor/ into a debug-signed APK for sideloading (not a Play Store build).
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Website origin the app opens, e.g. http://192.168.1.20:3005 (PC on same Wi-Fi) or https://your-site"
        required: true
        type: string
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      OWNERLISTING_APP_URL: ${{ inputs.app_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install and sync
        working-directory: capacitor
        run: |
          npm install --no-audit --no-fund
          npx cap sync android
      - name: Build debug APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ownerlisting-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
