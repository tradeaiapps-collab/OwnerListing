name: Property feeds (hourly)

# Calls the property feed worker every hour at :20. Each connection runs only when it is due (daily at 02:00 Queensland time,
# or weekly on Sundays), so most ticks do nothing. The route records every run in feed_run (staff see them at /staff/feeds).
# Repository secrets: APP_URL (public https origin, no trailing slash) and PROPERTY_FEEDS_CRON_SECRET (same value as FEED_CRON_SECRET in the app).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: property-feeds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call the feed worker
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.PROPERTY_FEEDS_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and PROPERTY_FEEDS_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and PROPERTY_FEEDS_CRON_SECRET."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 2 --retry-all-errors --max-time 600 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/feeds/run")
          echo "$body"
          echo "Property feeds $(date -u +%FT%TZ): $body" >> "$GITHUB_STEP_SUMMARY"
          sync=$(curl -sS --fail-with-body --retry 2 --retry-all-errors --max-time 300 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/feeds/sync")
          echo "$sync"
          echo "CRM status sync $(date -u +%FT%TZ): $sync" >> "$GITHUB_STEP_SUMMARY"
