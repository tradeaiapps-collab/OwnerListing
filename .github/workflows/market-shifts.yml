name: Market-shift alerts (daily)

# Calls the market-shift job on the public site at 7:30am Brisbane time (21:30 UTC) every day. The job tells each agent about notable
# changes in the areas they act in (prices, activity, time to sell, buyer interest), once per shift per month, through their notification settings.
# Repository secrets: APP_URL (public https origin, no trailing slash) and MARKET_SHIFT_CRON_SECRET (same value as the app, 32+ characters).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: market-shifts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send market-shift alerts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.MARKET_SHIFT_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and MARKET_SHIFT_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and MARKET_SHIFT_CRON_SECRET."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 60 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/market-shifts/run")
          echo "$body"
          echo "Market shifts $(date -u +%FT%TZ): $body" >> "$GITHUB_STEP_SUMMARY"
