name: Agent reports (hourly)

# Calls the scheduled-reports job on the public site at 5 minutes past every hour. The job emails each agent's due reports
# (daily, Mondays or the 1st at 8am Brisbane time) to their own account email, and books the next run.
# Repository secrets: APP_URL (public https origin, no trailing slash) and AGENT_REPORT_CRON_SECRET (same value as the app).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-reports
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due scheduled reports
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.AGENT_REPORT_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and AGENT_REPORT_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and AGENT_REPORT_CRON_SECRET."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 60 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/agent-reports/run")
          echo "$body"
          echo "Agent reports $(date -u +%FT%TZ): $body" >> "$GITHUB_STEP_SUMMARY"
