name: Video queue (every 5 minutes)

# Calls the video queue tick: submits queued tour videos to Hedra, checks running ones, retries failures and fails the ones past their deadline.
# Safe to repeat: each video is claimed with a short lease before it is worked on.
# Repository secrets: APP_URL (public https origin, no trailing slash) and VIDEO_CRON_SECRET (same value as the app).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: video-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the video queue
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.VIDEO_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and VIDEO_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and VIDEO_CRON_SECRET."
            exit 1
          fi
          curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 120 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/videos/tick"
