name: Scheduled reports (hourly)

# Calls the scheduled-reports job on the public site every hour at :05. The route runs whichever staff report schedules are due and emails
# each to its owner; it is safe to repeat. The route writes one job.scheduled_reports_run audit event per call.
# Repository secrets: APP_URL (public https origin, no trailing slash) and REPORTS_CRON_SECRET (same value as the app, 32+ chars).
# While both are unset the run is skipped with a warning; one without the other, or any non-2xx answer, fails the run.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-reports
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the scheduled reports job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.REPORTS_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL and REPORTS_CRON_SECRET are not set; skipping (no deployment to call yet)."
            exit 0
          fi
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set both APP_URL and REPORTS_CRON_SECRET."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 120 -X POST \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/reports/run")
          echo "$body"
          echo "Scheduled reports $(date -u +%FT%TZ): $body" >> "$GITHUB_STEP_SUMMARY"
