; Mutual TLS in front of clamd. A client without a certificate signed by our private CA is refused before it reaches clamd.
foreground = yes
sslVersionMin = TLSv1.2

[clamd]
accept = 0.0.0.0:3443
connect = clamav:3310
cert = /certs/server.crt
key = /certs/server.key
CAfile = /certs/ca.crt
verifyChain = yes
requireCert = yes
