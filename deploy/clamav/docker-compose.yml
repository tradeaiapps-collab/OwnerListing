# ClamAV for OwnerListing uploads. Only the TLS front door (stunnel, port 3443) is published; clamd itself (3310)
# lives on the private compose network and is never reachable from the internet.
services:
  clamav:
    image: clamav/clamav:stable        # includes freshclam: signature updates run inside the container, several times a day
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav      # keep signatures across restarts so a restart does not re-download them
    environment:
      CLAMAV_NO_MILTERD: "true"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s               # first start downloads the signature database
    deploy:
      resources:
        limits:
          memory: 2g
  tls:
    build: ./stunnel
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "3443:3443"
    volumes:
      - ./certs:/certs:ro
volumes:
  clamav-db:
